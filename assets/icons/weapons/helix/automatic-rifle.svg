<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Automatic Rifle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1219"/>
      <stop offset="1" stop-color="#030507"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#77808b"/>
      <stop offset="0.38" stop-color="#242b32"/>
      <stop offset="0.72" stop-color="#183747"/>
      <stop offset="1" stop-color="#11151a"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f3f5"/>
      <stop offset="0.42" stop-color="#7c8792"/>
      <stop offset="0.72" stop-color="#183747"/>
      <stop offset="1" stop-color="#222930"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183747"/>
      <stop offset="1" stop-color="#161b20"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#007dbb" stop-opacity=".25"/>
      <stop offset="1" stop-color="#007dbb" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .body{fill:url(#metal);stroke:#007dbb;stroke-width:6;stroke-linejoin:round}
      .blade{fill:url(#blade);stroke:#38d5ff;stroke-width:6;stroke-linejoin:round}
      .wood{fill:url(#wood);stroke:#007dbb;stroke-width:6;stroke-linejoin:round}
      .detail{fill:#11161c;stroke:#007dbb;stroke-width:5;stroke-linejoin:round}
      .linefill{fill:#090c10;stroke:#38d5ff;stroke-width:5}
      .line{fill:none;stroke:#38d5ff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
      .edge{fill:none;stroke:#38d5ff;stroke-width:7;stroke-linecap:round;filter:url(#glow)}
      .bolt{fill:#38d5ff;stroke:#007dbb;stroke-width:4}
    </style>
  </defs>
  <rect width="512" height="512" rx="48" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="209" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="179" fill="none" stroke="#007dbb" stroke-width="3" opacity=".22"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#38d5ff" stroke-width="2" stroke-dasharray="11 17" opacity=".16"/>
  <path d="M79 65h354l14 14v354l-14 14H79l-14-14V79z" fill="none" stroke="#007dbb" stroke-width="9"/>
  <path d="M96 83h320M429 97v318M416 429H96M83 415V97" fill="none" stroke="#38d5ff" stroke-width="2" opacity=".72"/>
  <path d="M65 151h28m-28 210h28M419 151h28m-28 210h28" stroke="#38d5ff" stroke-width="5" opacity=".5"/>
  
    <g class="weapon" transform="rotate(-7 256 256)">
      <path class="body" d="M42 268l75-47 53 16-8 67-73 25-47-17z"/>
      <path class="body" d="M150 218h203l27 32-32 65H150z"/>
      <rect class="body" x="338" y="229" width="133" height="25" rx="8"/>
      <rect class="detail" x="232" y="303" width="91" height="76" rx="9"/>
      <path class="detail" d="M174 307h45l-15 69h-39z"/>
      <path class="line" d="M382 260l25 104m-39-104l-18 99"/>
      <path class="edge" d="M398 356h35M326 272h110"/>
      <rect class="detail" x="214" y="184" width="62" height="30" rx="7"/>
      
  <path class="line" d="M173 245h92m-75 24h118m-72-56v77"/>
  <circle class="bolt" cx="276" cy="240" r="7"/>
  <path class="line" d="M298 226l20-12m-9 53l21 15"/>

    </g>
</svg>
