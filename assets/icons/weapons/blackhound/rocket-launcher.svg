<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Rocket Launcher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1219"/>
      <stop offset="1" stop-color="#030507"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#77808b"/>
      <stop offset="0.38" stop-color="#242b32"/>
      <stop offset="0.72" stop-color="#34213f"/>
      <stop offset="1" stop-color="#11151a"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f3f5"/>
      <stop offset="0.42" stop-color="#7c8792"/>
      <stop offset="0.72" stop-color="#34213f"/>
      <stop offset="1" stop-color="#222930"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34213f"/>
      <stop offset="1" stop-color="#161b20"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#552080" stop-opacity=".25"/>
      <stop offset="1" stop-color="#552080" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .body{fill:url(#metal);stroke:#552080;stroke-width:6;stroke-linejoin:round}
      .blade{fill:url(#blade);stroke:#b96cff;stroke-width:6;stroke-linejoin:round}
      .wood{fill:url(#wood);stroke:#552080;stroke-width:6;stroke-linejoin:round}
      .detail{fill:#11161c;stroke:#552080;stroke-width:5;stroke-linejoin:round}
      .linefill{fill:#090c10;stroke:#b96cff;stroke-width:5}
      .line{fill:none;stroke:#b96cff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
      .edge{fill:none;stroke:#b96cff;stroke-width:7;stroke-linecap:round;filter:url(#glow)}
      .bolt{fill:#b96cff;stroke:#552080;stroke-width:4}
    </style>
  </defs>
  <rect width="512" height="512" rx="48" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="209" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="179" fill="none" stroke="#552080" stroke-width="3" opacity=".22"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#b96cff" stroke-width="2" stroke-dasharray="11 17" opacity=".16"/>
  <path d="M79 65h354l14 14v354l-14 14H79l-14-14V79z" fill="none" stroke="#552080" stroke-width="9"/>
  <path d="M96 83h320M429 97v318M416 429H96M83 415V97" fill="none" stroke="#b96cff" stroke-width="2" opacity=".72"/>
  <path d="M65 151h28m-28 210h28M419 151h28m-28 210h28" stroke="#b96cff" stroke-width="5" opacity=".5"/>
  
    <g class="weapon" transform="rotate(-8 256 256)">
      <rect class="body" x="56" y="204" width="407" height="91" rx="43"/>
      <ellipse class="linefill" cx="64" cy="250" rx="29" ry="52"/>
      <ellipse class="linefill" cx="456" cy="250" rx="22" ry="42"/>
      <path class="detail" d="M215 292h58l-7 105h-48z"/>
      <path class="detail" d="M328 292h45l28 76h-45z"/>
      <rect class="detail" x="247" y="157" width="91" height="45" rx="9"/>
      <path class="edge" d="M103 225h319M104 274h319"/>
      <path class="line" d="M151 210v80m42-80v80m217-79v78"/>
    </g>
</svg>
