<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Advanced Sword">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1219"/>
      <stop offset="1" stop-color="#030507"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#77808b"/>
      <stop offset="0.38" stop-color="#242b32"/>
      <stop offset="0.72" stop-color="#4c2430"/>
      <stop offset="1" stop-color="#11151a"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f3f5"/>
      <stop offset="0.42" stop-color="#7c8792"/>
      <stop offset="0.72" stop-color="#4c2430"/>
      <stop offset="1" stop-color="#222930"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c2430"/>
      <stop offset="1" stop-color="#161b20"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#a70d35" stop-opacity=".25"/>
      <stop offset="1" stop-color="#a70d35" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .body{fill:url(#metal);stroke:#a70d35;stroke-width:6;stroke-linejoin:round}
      .blade{fill:url(#blade);stroke:#f6f7fb;stroke-width:6;stroke-linejoin:round}
      .wood{fill:url(#wood);stroke:#a70d35;stroke-width:6;stroke-linejoin:round}
      .detail{fill:#11161c;stroke:#a70d35;stroke-width:5;stroke-linejoin:round}
      .linefill{fill:#090c10;stroke:#f6f7fb;stroke-width:5}
      .line{fill:none;stroke:#f6f7fb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
      .edge{fill:none;stroke:#f6f7fb;stroke-width:7;stroke-linecap:round;filter:url(#glow)}
      .bolt{fill:#f6f7fb;stroke:#a70d35;stroke-width:4}
    </style>
  </defs>
  <rect width="512" height="512" rx="48" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="209" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="179" fill="none" stroke="#a70d35" stroke-width="3" opacity=".22"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#f6f7fb" stroke-width="2" stroke-dasharray="11 17" opacity=".16"/>
  <path d="M79 65h354l14 14v354l-14 14H79l-14-14V79z" fill="none" stroke="#a70d35" stroke-width="9"/>
  <path d="M96 83h320M429 97v318M416 429H96M83 415V97" fill="none" stroke="#f6f7fb" stroke-width="2" opacity=".72"/>
  <path d="M65 151h28m-28 210h28M419 151h28m-28 210h28" stroke="#f6f7fb" stroke-width="5" opacity=".5"/>
  
    <g class="weapon" transform="rotate(-38 256 256)">
      <path class="blade" d="M241 31c59 64 80 157 58 288l-72 2c20-114 5-212 14-290z"/>
      <path class="edge" d="M260 68c31 72 38 148 22 222M239 173h54"/>
      <path class="detail" d="M199 305h132v38H199z"/>
      <path class="body" d="M225 338h79l-4 130h-70z"/>
      <path class="bolt" d="M256 351l-15 38h24l-18 40 49-52h-27l19-26z"/>
    </g>
</svg>
