<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Absorption Plates">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101923"/><stop offset="1" stop-color="#030609"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8594a3"/><stop offset=".38" stop-color="#26323d"/>
      <stop offset=".72" stop-color="#17212a"/><stop offset="1" stop-color="#090d12"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#ffc857" stop-opacity=".24"/><stop offset="1" stop-color="#ffc857" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .plate{fill:url(#armor);stroke:#ffc857;stroke-width:7;stroke-linejoin:round}
      .accent{fill:#0a1118;stroke:#ffc857;stroke-width:6;stroke-linejoin:round}
      .line{fill:none;stroke:#ffc857;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.78}
    </style>
  </defs>
  <rect width="512" height="512" rx="48" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="208" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="177" fill="none" stroke="#ffc857" stroke-width="3" opacity=".22"/>
  <circle cx="256" cy="256" r="133" fill="none" stroke="#ffc857" stroke-width="2" stroke-dasharray="12 18" opacity=".16"/>
  <path d="M79 65h354l14 14v354l-14 14H79l-14-14V79z" fill="none" stroke="#ffc857" stroke-width="9"/>
  <path d="M96 83h320M429 97v318M416 429H96M83 415V97" fill="none" stroke="#ffc857" stroke-width="2" opacity=".72"/>
