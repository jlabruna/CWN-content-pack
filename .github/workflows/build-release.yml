name: Build Foundry module

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out content pack
        uses: actions/checkout@v4

      - name: Check out SWNR 2.3.0 build reference
        uses: actions/checkout@v4
        with:
          repository: wintersleepAI/swnr
          ref: v2.3.0
          path: vendor/swnr

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build weapon compendium
        run: node tools/build-weapon-compendium.mjs vendor/swnr

      - name: Generate armor icons
        run: node tools/generate-armor-icons.mjs

      - name: Build armor compendium
        run: node tools/build-armor-compendium.mjs vendor/swnr

      - name: Generate ammunition icons
        run: node tools/generate-ammunition-icons.mjs

      - name: Build ammunition compendium
        run: node tools/build-ammunition-compendium.mjs

      - name: Generate Common Operator Gear icons
        run: node tools/generate-common-operator-gear-icons.mjs

      - name: Build Common Operator Gear compendium
        run: node tools/build-common-operator-gear-compendium.mjs

      - name: Generate cyberware icons
        run: node tools/generate-cyberware-icons.mjs

      - name: Build cyberware compendium
        run: node tools/build-cyberware-compendium.mjs

      - name: Validate generated content
        run: node tools/validate-content.mjs

      - name: Verify deterministic rebuild
        run: node tools/verify-deterministic-build.mjs vendor/swnr

      - name: Stage Foundry module
        run: node tools/stage-release.mjs

      - name: Build Foundry ZIP
        shell: bash
        run: |
          cd release/cwn-content-pack
          zip -r ../cwn-content-pack-${GITHUB_REF_NAME}.zip .

      - name: Validate ZIP contents
        shell: bash
        run: |
          ZIP="release/cwn-content-pack-${GITHUB_REF_NAME}.zip"
          unzip -t "$ZIP"
          unzip -Z1 "$ZIP" | grep -qx "module.json"
          unzip -Z1 "$ZIP" | grep -q "^packs/harbour-city-stories-weapons/"
          unzip -Z1 "$ZIP" | grep -q "^packs/harbour-city-stories-armor/"
          unzip -Z1 "$ZIP" | grep -q "^packs/cwn-ammunition/"
          unzip -Z1 "$ZIP" | grep -q "^packs/cwn-common-operator-gear/"
          unzip -Z1 "$ZIP" | grep -q "^packs/cwn-cyberware/"
          test "$(unzip -Z1 "$ZIP" | grep -c '^assets/icons/ammunition/.*\.svg$')" -eq 14
          test "$(unzip -Z1 "$ZIP" | grep -c '^assets/icons/gear/common-operator-gear/.*\.svg$')" -eq 27
          test "$(unzip -Z1 "$ZIP" | grep -c '^assets/icons/cyberware/.*\.svg$')" -eq 88
          echo "Release ZIP contains all five declared packs and all expected icon assets."

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cwn-content-pack-${{ github.ref_name }}
          path: |
            release/cwn-content-pack-${{ github.ref_name }}.zip
            release/module.json

      - name: Attach files to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/cwn-content-pack-${{ github.ref_name }}.zip
            release/module.json
